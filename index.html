<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruteo Inteligente · Mystery Shopper Coltabaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --shark:#2A2D34; --ink:#1A2E35; --teal:#00D6C9; --teal2:#2BBFAA;
  --paper:#EEF2F3; --card:#FFFFFF; --line:#E1E6E8; --line2:#EDF1F2;
  --warn:#FF7A00; --warn-bg:#FFF1E3;
  --tx:#20272B; --mut:#69767C; --mut2:#93A0A6;
  --sh:0 1px 2px rgba(26,46,53,.06),0 8px 24px rgba(26,46,53,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,Arial,sans-serif;color:var(--tx);background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header{background:var(--shark);color:#fff;display:flex;align-items:center;gap:20px;
  padding:12px 20px;flex:0 0 auto;z-index:1200}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--shark);
  font-family:Sora;font-weight:700;font-size:19px}
.brand h1{font-family:Sora;font-size:16px;font-weight:600;margin:0;letter-spacing:.1px;line-height:1.15}
.brand p{margin:2px 0 0;font-size:11.5px;color:#B7C0C4}
.kpis{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
  border-radius:11px;padding:7px 13px;min-width:82px}
.kpi .v{font-family:Sora;font-weight:600;font-size:18px;line-height:1;color:#fff}
.kpi .v small{font-size:11px;color:var(--teal);font-weight:600;margin-left:2px}
.kpi .l{font-size:10.5px;color:#AEB8BC;margin-top:4px;white-space:nowrap}
.kpi.warn .v{color:#FFB877}

/* ---------- body ---------- */
.wrap{flex:1;display:flex;min-height:0}
aside{width:352px;flex:0 0 352px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.controls{padding:15px 16px 12px;border-bottom:1px solid var(--line2)}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;
  font-family:Inter;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:.12s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(26,46,53,.12)}
.seg button .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

.row2{display:flex;gap:9px;margin-top:11px}
label.fld{flex:1;font-size:11px;color:var(--mut);font-weight:500}
label.fld span{display:block;margin-bottom:5px}
select,.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  font-family:Inter;font-size:12.5px;color:var(--tx);background:var(--card);cursor:pointer}
select:focus,.inp:focus{outline:2px solid var(--teal);outline-offset:-1px}
.inp{cursor:text}

.toggles{display:flex;gap:8px;margin-top:11px}
.tg{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:11.5px;color:var(--tx);cursor:pointer;user-select:none;font-weight:500}
.tg input{accent-color:var(--teal);width:15px;height:15px;margin:0}
.tg.on{border-color:var(--teal);background:#F0FCFB}

.listhead{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 7px}
.listhead h2{font-family:Sora;font-size:12.5px;font-weight:600;color:var(--ink);margin:0;
  text-transform:none;letter-spacing:.2px}
.listhead .c{font-size:11px;color:var(--mut2);font-weight:500}
.list{flex:1;overflow-y:auto;padding:0 10px 14px}
.rt{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;cursor:pointer;
  border:1px solid transparent;transition:.1s}
.rt:hover{background:var(--paper)}
.rt.sel{background:#F0FCFB;border-color:var(--teal)}
.rt .bar{width:4px;align-self:stretch;border-radius:3px;flex:0 0 4px}
.rt .mid{flex:1;min-width:0}
.rt .t{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.rt .t .code{font-family:Sora}
.rt .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.rt .r{text-align:right;flex:0 0 auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  background:var(--warn-bg);color:var(--warn);padding:2px 7px;border-radius:20px}
.pill-day{font-size:10.5px;font-weight:600;color:var(--mut);background:var(--paper);
  padding:2px 7px;border-radius:20px}

/* ---------- map ---------- */
.mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#DCE3E5}
.leaflet-container{font-family:Inter}
.pin{width:100%;height:100%;border-radius:50%;background:var(--c);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;font-family:Inter;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.pin.start{box-shadow:0 0 0 3px rgba(0,214,201,.5),0 1px 4px rgba(0,0,0,.35)}
.pin.warn{background:var(--warn)}

/* legend */
.legend{position:absolute;left:12px;bottom:12px;z-index:800;background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  box-shadow:var(--sh);font-size:11.5px;color:var(--tx);max-width:230px}
.legend b{font-family:Sora;font-size:11px;color:var(--ink);display:block;margin-bottom:7px;font-weight:600}
.legend .li{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--mut)}
.lk{width:22px;height:0;border-top:3px solid var(--teal);border-radius:2px}
.lk.dash{border-top:3px dashed var(--warn)}
.lk.dot{width:11px;height:11px;border:0;border-radius:50%;background:var(--mut2)}
.lk.num{width:16px;height:16px;border-radius:50%;background:var(--teal);border:2px solid #fff}

/* detail panel */
.detail{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);
  z-index:900;background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh);display:none;flex-direction:column;overflow:hidden}
.detail.show{display:flex}
.dhead{padding:14px 15px 12px;border-bottom:1px solid var(--line2);position:relative}
.dhead .code{font-family:Sora;font-size:16px;font-weight:700;color:var(--ink)}
.dhead .sub{font-size:12px;color:var(--mut);margin-top:2px}
.dhead .x{position:absolute;top:12px;right:12px;width:26px;height:26px;border:0;border-radius:8px;
  background:var(--paper);color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
.dhead .x:hover{background:var(--line);color:var(--tx)}
.chips{display:flex;gap:7px;margin-top:11px}
.chip{flex:1;background:var(--paper);border-radius:9px;padding:7px 9px;text-align:center}
.chip .v{font-family:Sora;font-weight:600;font-size:15px;color:var(--ink)}
.chip .l{font-size:10px;color:var(--mut);margin-top:2px}
.chip.warn .v{color:var(--warn)}
.dact{display:flex;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line2)}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px;
  font-family:Inter;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s}
.btn:hover{border-color:var(--teal);color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#12232a}
.btn svg{width:14px;height:14px}
.stops{overflow-y:auto;padding:4px 0}
.stop{display:flex;align-items:flex-start;gap:11px;padding:9px 15px}
.stop:not(:last-child){border-bottom:1px solid var(--line2)}
.stop .n{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.stop.w .n{background:var(--warn)}
.stop .info{flex:1;min-width:0}
.stop .nm{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25}
.stop .ad{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.3}
.stop .meta{font-size:10.5px;color:var(--mut2);margin-top:3px;display:flex;gap:9px;align-items:center}
.stop .meta .tp{color:var(--warn);font-weight:600}
.stop .id{font-variant-numeric:tabular-nums}

.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:500;
  z-index:1500;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* scrollbars */
.list::-webkit-scrollbar,.stops::-webkit-scrollbar{width:9px}
.list::-webkit-scrollbar-thumb,.stops::-webkit-scrollbar-thumb{background:#CDD6D9;border-radius:9px;border:2px solid var(--card)}

/* revisita pin */
.pin.rev{background:#fff;color:var(--c);border:2px solid var(--c);
  box-shadow:0 0 0 3px rgba(255,157,66,.55),0 1px 4px rgba(0,0,0,.3)}
/* excel download button */
.dl{margin-top:11px}
.dl button{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;
  padding:10px;font-family:Inter;font-size:12.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.12s}
.dl button:hover{background:#12232a}
.dl button svg{width:15px;height:15px}
/* stop ejecutivo + revisita */
.stop .ej{font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.3}
.stop.rev .n{background:#fff;color:var(--teal2);border:2px solid var(--teal2)}
.stop .meta .rv{color:#C9761B;font-weight:600}
/* legend keys */
.lk.rev{width:13px;height:13px;border:2px solid var(--teal2);border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,157,66,.5)}
.lk.dot.v{background:#B7C2C7}
.lk.dot.n{background:#E6A15C}
.badge.rev{background:#FFF2E4;color:#C9761B}
/* leaflet popup */
.leaflet-popup-content-wrapper{border-radius:13px;box-shadow:0 8px 28px rgba(26,46,53,.20);padding:3px 4px}
.leaflet-popup-content{margin:11px 13px 12px;font-family:Inter;font-size:12px;color:var(--tx);line-height:1.4;min-width:210px}
.leaflet-popup-tip{box-shadow:0 8px 28px rgba(26,46,53,.20)}
.pp .tt{font-family:Sora;font-weight:600;font-size:13px;color:var(--ink);margin-bottom:3px;padding-right:6px}
.pp .rowi{display:flex;gap:7px;margin-top:5px;font-size:11.5px;align-items:baseline}
.pp .rowi .k{flex:0 0 auto;width:15px;text-align:center;filter:grayscale(.15)}
.pp .rowi .val{color:var(--tx);min-width:0}
.pp .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pp .tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--paper);color:var(--mut)}
.pp .tag.st{background:#EDF6F5;color:#0E8F86}
.pp .tag.tr{background:var(--warn-bg);color:var(--warn)}
.pp .tag.rv{background:#FFF2E4;color:#C9761B}
.pp .tag.ex{background:#EEF1F2;color:#69767C}
.pp .go{margin-top:10px;width:100%;border:1px solid var(--teal);background:#F0FCFB;color:var(--ink);
  border-radius:8px;padding:7px;font-family:Inter;font-size:11.5px;font-weight:600;cursor:pointer}
.pp .go:hover{background:#E3F9F7}
.cap{font-size:10.5px;color:var(--mut);font-weight:600;margin:0 0 5px 2px;letter-spacing:.2px}
.cap.mt{margin-top:11px}
.pill-r{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.pill-r.r1{background:#EDF6F5;color:#0E8F86}
.pill-r.r2{background:#FFF2E4;color:#C9761B}
.rt .t{flex-wrap:wrap}
.lhspan{font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
.stop .rp{font-size:10.5px;color:#C9761B;margin-top:2px}
.pp .tag.r1{background:#EDF6F5;color:#0E8F86}
.pp .tag.r2{background:#FFF2E4;color:#C9761B}

@media (max-width:860px){
  header{flex-wrap:wrap;gap:10px}
  .kpis{margin-left:0;width:100%;justify-content:flex-start}
  .wrap{flex-direction:column}
  aside{width:100%;flex:0 0 auto;max-height:44%;border-right:0;border-bottom:1px solid var(--line)}
  .mapwrap{flex:1;min-height:340px}
  .detail{width:auto;left:12px;right:12px;top:auto;bottom:12px;max-height:60%}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">j&amp;t</div>
    <div>
      <h1>Ruteo Inteligente — Mystery Shopper</h1>
      <p>Coltabaco · Excelencia en Ejecución · job&amp;talent &nbsp;|&nbsp; <span id="gen"></span></p>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<div class="wrap">
  <aside>
    <div class="controls">
      <div class="cap">Zona · un auditor por zona</div>
      <div class="seg" id="zonaSeg">
        <button data-z="all" class="on">Todas</button>
        <button data-z="Zona Bogotá"><span class="d" style="background:#00D6C9"></span>Bogotá</button>
        <button data-z="Zona Cali"><span class="d" style="background:#FF9D42"></span>Cali</button>
      </div>
      <div class="cap mt">Ronda del mes</div>
      <div class="seg" id="rondaSeg">
        <button data-r="all" class="on">Todo</button>
        <button data-r="1">Pendientes</button>
        <button data-r="2">Repise</button>
      </div>
      <div class="row2">
        <label class="fld"><span>Ciudad</span>
          <select id="citySel"></select>
        </label>
        <label class="fld"><span>Buscar PDV (ID o nombre)</span>
          <input class="inp" id="search" placeholder="Ej. 316323 o rapitienda" autocomplete="off">
        </label>
      </div>
      <div class="toggles">
        <label class="tg" id="tgLines"><input type="checkbox" id="ckLines">Ver líneas de todas las rutas del filtro</label>
      </div>
      <div class="dl">
        <button id="dlXlsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Descargar Excel (cronograma + rutas)</button>
      </div>
      <div class="dl">
        <button id="dlXlsx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Descargar Excel del ruteo
        </button>
      </div>
    </div>
    <div class="listhead">
      <h2 id="lhTitle">Rutas · días</h2>
      <span class="c" id="lhCount"></span>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend" id="legend">
      <b>Cómo leer el mapa</b>
      <div class="li"><span class="lk num"></span> Orden de visita del día</div>
      <div class="li"><span class="lk"></span> Recorrido a pie (&lt; 1 km)</div>
      <div class="li"><span class="lk dash"></span> Tramo con <b style="color:var(--warn);display:inline;margin:0">transporte</b> (&gt; 1 km)</div>
      <div class="li"><span class="lk rev"></span> Revisita (visitado usado para completar)</div>
    </div>
    <div class="detail" id="detail"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const CITY_BY_ZONA = {};
DATA.routes.forEach(r=>{ (CITY_BY_ZONA[r.zona] ||= new Set()).add(r.ciudad); });

const S = { zona:'all', ciudad:'all', ronda:'all', route:null, lines:false, q:'' };

/* ---------- map ---------- */
const map = L.map('map',{zoomControl:true,preferCanvas:true}).setView([4.15,-74.9],7);
L.control.zoom({position:'topleft'}); // keep default
// Basemap gris claro sin API key (Esri Light Gray), con respaldo automático a OpenStreetMap
const baseLight = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri', maxZoom:19
}).addTo(map);
const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap', maxZoom:19
});
let _tileErr=0,_swapped=false;
baseLight.on('tileerror',()=>{ if(!_swapped && ++_tileErr>=4){ _swapped=true; map.removeLayer(baseLight); baseOSM.addTo(map);} });
const cv = L.canvas({padding:.4});
const gPts   = L.layerGroup().addTo(map);   // overview points
const gLines = L.layerGroup().addTo(map);   // all-route polylines
const gSel   = L.layerGroup().addTo(map);   // selected route

const fmt = n => (n||0).toLocaleString('es-CO');
const km  = n => (n||0).toFixed(1).replace('.',',');

/* ---------- filtro ---------- */
function fRoutes(){
  return DATA.routes.filter(r =>
    (S.zona==='all'||r.zona===S.zona) &&
    (S.ciudad==='all'||r.ciudad===S.ciudad) &&
    (S.ronda==='all'||String(r.ronda)===S.ronda)
  ).sort((a,b)=> a.zona===b.zona ? a.dia-b.dia : a.zona.localeCompare(b.zona));
}
function boundsOf(routes){
  const b=L.latLngBounds([]);
  routes.forEach(r=>r.pts.forEach(p=>b.extend([p.lat,p.lon])));
  return b;
}

/* ---------- popups ---------- */
function estadoTag(e){
  const m={'VISITADO':'visitado','NOVEDAD':'con novedad','PROGRAMADO':'programado','SIN VISITAR':'sin visitar','ND':'pendiente'};
  return m[e]||(e||'').toLowerCase();
}
function ppRow(icon,val){ return val?`<div class="rowi"><span class="k">${icon}</span><span class="val">${val}</span></div>`:''; }
function metaLine(p){ return [p.canal,p.sub,p.tier?('TIER '+p.tier):''].filter(Boolean).join(' · '); }

function popupRoutePt(p,r){
  const tags=[`<span class="tag r${r.ronda}">${r.ronda===1?'Pendientes':'Repise'}</span>`,
              `<span class="tag st">${estadoTag(p.estado)}</span>`];
  if(p.rev) tags.push('<span class="tag rv">↻ revisita</span>');
  if(p.t)   tags.push(`<span class="tag tr">🚌 transporte · ${fmt(p.dm)} m</span>`);
  else if(p.orden>1) tags.push(`<span class="tag">salto ${fmt(p.dm)} m</span>`);
  return `<div class="pp">
    <div class="tt">${p.orden}. ${p.nombre}</div>
    ${ppRow('👤',p.ejec)}
    ${ppRow('📍',p.dir)}
    ${ppRow('🏷️',metaLine(p))}
    ${ppRow('📅', (r.ronda===2 && p.fvis)?('última visita '+p.fvis):'')}
    ${ppRow('#','DBD '+p.id+' · '+r.code+' · '+r.fecha_txt)}
    <div class="tags">${tags.join('')}</div>
  </div>`;
}
function popupOverviewPt(p,r){
  return `<div class="pp">
    <div class="tt">${p.nombre}</div>
    ${ppRow('👤',p.ejec)}
    ${ppRow('📍',p.dir)}
    ${ppRow('🏷️',metaLine(p))}
    ${ppRow('#','DBD '+p.id)}
    <div class="tags"><span class="tag r${r.ronda}">${r.ronda===1?'Pendientes':'Repise'}</span><span class="tag st">${r.code} · ${r.fecha_txt}</span></div>
    <button class="go" onclick="goRoute('${r.code}')">Ver ruta ${r.code} →</button>
  </div>`;
}

/* ---------- KPIs ---------- */
function renderKpis(){
  const rs=fRoutes();
  const pdv=rs.reduce((a,r)=>a+r.n,0);
  const kmt=rs.reduce((a,r)=>a+r.km,0);
  const tr =rs.reduce((a,r)=>a+r.ntrans,0);
  const prom = rs.length? (pdv/rs.length):0;
  const lbl = S.ronda==='2'?'PDV a repisar':(S.ronda==='1'?'PDV pendientes':'PDV totales');
  const K=[
    [lbl,fmt(pdv),''],
    ['Rutas · días',fmt(rs.length),''],
    ['PDV por día',prom.toFixed(1).replace('.',','),' <small>prom</small>'],
    ['Recorrido',km(kmt),' <small>km</small>'],
    ['Transportes',fmt(tr),'',true],
  ];
  document.getElementById('kpis').innerHTML = K.map(k=>
    `<div class="kpi${k[3]?' warn':''}"><div class="v">${k[1]}${k[2]}</div><div class="l">${k[0]}</div></div>`
  ).join('');
}

/* ---------- city select ---------- */
function renderCitySel(){
  const sel=document.getElementById('citySel');
  let cities;
  if(S.zona==='all') cities=[...new Set(DATA.routes.map(r=>r.ciudad))];
  else cities=[...(CITY_BY_ZONA[S.zona]||[])];
  cities.sort();
  sel.innerHTML = `<option value="all">Todas las ciudades</option>`+
    cities.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.value = cities.includes(S.ciudad)? S.ciudad : 'all';
  if(sel.value==='all') S.ciudad='all';
}

/* ---------- route list ---------- */
function renderList(){
  const rs=fRoutes();
  const lh=document.getElementById('lhCount');
  if(rs.length) lh.innerHTML = `${rs.length} ${rs.length===1?'ruta':'rutas'} · ${rs[0].fecha_txt} → ${rs[rs.length-1].fecha_txt}`;
  else lh.textContent='';
  const el=document.getElementById('list');
  if(!rs.length){ el.innerHTML=`<div style="padding:26px 14px;color:var(--mut2);font-size:12.5px;text-align:center">Sin rutas para este filtro.</div>`; return;}
  el.innerHTML = rs.map(r=>`
    <div class="rt${S.route===r.code?' sel':''}" data-code="${r.code}">
      <div class="bar" style="background:${r.color}"></div>
      <div class="mid">
        <div class="t"><span class="code">${r.code}</span>
          <span class="pill-day">${r.fecha_txt}</span>
          <span class="pill-r r${r.ronda}">${r.ronda===1?'pend':'repise'}</span></div>
        <div class="s">${r.ciudad} · ${r.n} PDV · ${km(r.km)} km</div>
      </div>
      <div class="r">${r.ntrans?`<span class="badge">🚌 ${r.ntrans}</span>`:''}${r.nrev?`<span class="badge rev">↻ ${r.nrev}</span>`:''}</div>
    </div>`).join('');
  el.querySelectorAll('.rt').forEach(n=> n.onclick=()=>selectRoute(n.dataset.code));
}

/* ---------- draw ---------- */
function clearAll(){ [gPts,gLines,gSel].forEach(g=>g.clearLayers()); }

function drawOverview(){
  const rs=fRoutes();
  rs.forEach(r=>{
    r.pts.forEach(p=>{
      L.circleMarker([p.lat,p.lon],{renderer:cv,radius:4.5,weight:1.2,color:'#fff',
        fillColor:r.color,fillOpacity:.92}).addTo(gPts)
        .bindPopup(popupOverviewPt(p,r),{maxWidth:260})
        .bindTooltip(`<b>${r.code}</b> · ${r.fecha_txt}<br>${p.nombre}`,{direction:'top'});
    });
    if(S.lines){
      L.polyline(r.pts.map(p=>[p.lat,p.lon]),{renderer:cv,color:r.color,weight:2.2,opacity:.5}).addTo(gLines);
    }
  });
}

function drawSelected(r){
  fRoutes().forEach(o=>{ if(o.code===r.code) return;
    o.pts.forEach(p=>L.circleMarker([p.lat,p.lon],{renderer:cv,radius:2.5,weight:0,
      fillColor:'#AEBBC0',fillOpacity:.35}).addTo(gSel)); });
  for(let i=1;i<r.pts.length;i++){
    const a=r.pts[i-1], b=r.pts[i];
    if(b.t) L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:'#FF7A00',weight:3.4,opacity:.95,dashArray:'3 7'}).addTo(gSel);
    else    L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:r.color,weight:3.6,opacity:.92}).addTo(gSel);
  }
  r.pts.forEach(p=>{
    const cls = 'pin'+(p.orden===1?' start':'')+(p.t?' warn':'')+(p.rev?' rev':'');
    const icon=L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
      html:`<div class="${cls}" style="--c:${r.color}">${p.orden}</div>`});
    L.marker([p.lat,p.lon],{icon,zIndexOffset:400}).addTo(gSel)
      .bindPopup(popupRoutePt(p,r),{maxWidth:260})
      .bindTooltip(`<b>${p.orden}. ${p.nombre}</b>`,{direction:'top'});
  });
}

function render(){
  clearAll();
  const rs=fRoutes();
  if(S.route){
    const r=DATA.routes.find(x=>x.code===S.route);
    if(r){ drawSelected(r); map.fitBounds(boundsOf([r]).pad(.28),{maxZoom:16}); }
  }else{
    drawOverview();
    if(rs.length){ map.fitBounds(boundsOf(rs).pad(.06)); }
  }
  renderKpis(); renderList(); renderDetail();
}

/* ---------- detail ---------- */
const IC_MAP=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 7v13M15 4v13"/></svg>`;
const IC_COPY=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

function renderDetail(){
  const el=document.getElementById('detail');
  if(!S.route){ el.classList.remove('show'); el.innerHTML=''; return; }
  const r=DATA.routes.find(x=>x.code===S.route);
  if(!r){ el.classList.remove('show'); return; }
  el.classList.add('show');
  el.innerHTML=`
    <div class="dhead">
      <button class="x" id="dx">✕</button>
      <div class="code" style="display:flex;align-items:center;gap:9px">
        <span style="width:12px;height:12px;border-radius:4px;background:${r.color};display:inline-block"></span>
        ${r.code} <span class="pill-r r${r.ronda}" style="font-size:10px">${r.ronda===1?'pendientes':'repise'}</span></div>
      <div class="sub">${r.ciudad} · ${r.zona} · <b style="color:var(--ink)">${r.fecha_full}</b></div>
      <div class="chips">
        <div class="chip"><div class="v">${r.n}</div><div class="l">PDV</div></div>
        <div class="chip"><div class="v">${km(r.km)}</div><div class="l">km recorrido</div></div>
        <div class="chip warn"><div class="v">${r.ntrans}</div><div class="l">transportes</div></div>
        ${r.nrev?`<div class="chip"><div class="v" style="color:#C9761B">${r.nrev}</div><div class="l">revisita${r.nrev>1?'s':''}</div></div>`:''}
      </div>
    </div>
    <div class="dact">
      <button class="btn pri" id="dmap">${IC_MAP} Abrir en Google Maps</button>
      <button class="btn" id="dcopy">${IC_COPY} Copiar IDs</button>
    </div>
    <div class="stops">
      ${r.pts.map(p=>`
        <div class="stop ${p.t?'w':''} ${p.rev?'rev':''}">
          <div class="n">${p.orden}</div>
          <div class="info">
            <div class="nm">${p.nombre}</div>
            <div class="ad">${p.dir}</div>
            ${p.ejec?`<div class="ej">👤 ${p.ejec}${p.tier?' · TIER '+p.tier:''}</div>`:''}
            ${(r.ronda===2&&p.fvis)?`<div class="rp">↻ repise · última visita ${p.fvis}</div>`:''}
            <div class="meta"><span class="id">DBD ${p.id}</span>
              ${p.orden===1?'<span>· inicio</span>':`<span>· salto ${fmt(p.dm)} m</span>`}
              ${p.t?'<span class="tp">· 🚌 transporte</span>':''}
              ${p.rev?'<span class="rv">· ↻ revisita</span>':''}
            </div>
          </div>
        </div>`).join('')}
    </div>`;
  el.querySelector('#dx').onclick=()=>selectRoute(null);
  el.querySelector('#dmap').onclick=()=>{
    const url='https://www.google.com/maps/dir/'+r.pts.map(p=>`${p.lat},${p.lon}`).join('/');
    window.open(url,'_blank');
  };
  el.querySelector('#dcopy').onclick=()=>{
    const txt=r.pts.map(p=>`${p.orden}\t${p.id}\t${p.nombre}`).join('\n');
    navigator.clipboard.writeText(`Ruta ${r.code} · ${r.ciudad} · ${r.fecha_full}\n`+txt)
      .then(()=>toast(`IDs de ${r.code} copiados`)).catch(()=>toast('No se pudo copiar'));
  };
}

/* ---------- select / search ---------- */
function selectRoute(code){
  S.route = (code===S.route)? null : code;
  if(S.route){
    const r=DATA.routes.find(x=>x.code===S.route);
    if(r){
      if(S.zona!=='all'&&r.zona!==S.zona) S.zona=r.zona;
      if(S.ciudad!=='all'&&r.ciudad!==S.ciudad) S.ciudad='all';
      if(S.ronda!=='all'&&String(r.ronda)!==S.ronda) S.ronda=String(r.ronda);
      syncControls();
    }
  }
  render();
}
window.goRoute = (c)=>selectRoute(c);

function runSearch(){
  const q=S.q.trim().toLowerCase();
  if(!q) return;
  let hit=null,hitP=null;
  for(const r of DATA.routes){
    for(const p of r.pts){
      if(String(p.id).includes(q) || p.nombre.toLowerCase().includes(q)){ hit=r;hitP=p;break; }
    }
    if(hit) break;
  }
  if(!hit){ toast('Sin coincidencias'); return; }
  S.zona=hit.zona; S.ciudad='all'; S.ronda=String(hit.ronda); syncControls();
  selectRoute(hit.code);
  map.setView([hitP.lat,hitP.lon],17,{animate:true});
  toast(`${hitP.nombre} → ${hit.code} (${hit.fecha_txt})`);
}

/* ---------- toast ---------- */
let tT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- descargar excel ---------- */
function downloadXlsx(){
  try{
    const b64=DATA.xlsx_b64; if(!b64){toast('Excel no disponible');return;}
    const bin=atob(b64); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='Ruteo_Mistery_Coltabaco.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Descargando Excel…');
  }catch(e){ toast('No se pudo descargar el Excel'); }
}

/* ---------- controls sync ---------- */
function syncControls(){
  document.querySelectorAll('#zonaSeg button').forEach(b=> b.classList.toggle('on', b.dataset.z===S.zona));
  document.querySelectorAll('#rondaSeg button').forEach(b=> b.classList.toggle('on', b.dataset.r===S.ronda));
  renderCitySel();
  document.getElementById('citySel').value = S.ciudad;
  document.getElementById('ckLines').checked=S.lines;
  document.getElementById('tgLines').classList.toggle('on',S.lines);
}

/* ---------- events ---------- */
document.querySelectorAll('#zonaSeg button').forEach(b=>b.onclick=()=>{
  S.zona=b.dataset.z; S.ciudad='all'; S.route=null; syncControls(); render();
});
document.querySelectorAll('#rondaSeg button').forEach(b=>b.onclick=()=>{
  S.ronda=b.dataset.r; S.route=null; syncControls(); render();
});
document.getElementById('citySel').onchange=e=>{ S.ciudad=e.target.value; S.route=null; render(); };
document.getElementById('ckLines').onchange=e=>{
  S.lines=e.target.checked; document.getElementById('tgLines').classList.toggle('on',S.lines); render();
};
document.getElementById('dlXlsx').onclick=downloadXlsx;
const si=document.getElementById('search');
si.addEventListener('keydown',e=>{ if(e.key==='Enter'){ S.q=si.value; runSearch(); }});
si.addEventListener('input',e=>{ S.q=e.target.value; });

/* ---------- go ---------- */
const _lt=document.getElementById('lhTitle'); if(_lt) _lt.textContent='Programación por día';
document.getElementById('gen').textContent='Generado '+DATA.generado;
syncControls(); render();
</script>
